[project]
name = "gsuite-manager"
version = "0.3.0"
description = "CLI tool for automating Google Workspace + Cloudflare domain & user management"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "nopperabbo" }]
keywords = ["google-workspace", "gsuite", "cloudflare", "dns", "automation", "cli", "admin"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "google-api-python-client>=2.130.0",
    "google-auth>=2.30.0",
    "google-auth-oauthlib>=1.2.0",
    "requests>=2.32.0",
    "dnspython>=2.6.0",
    "structlog>=24.1.0",
    "rich>=13.7.0",
    "pyyaml>=6.0",
    "faker>=24.0.0",
    "questionary>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/nopperabbo/gsuite-manager"
Repository = "https://github.com/nopperabbo/gsuite-manager"
Issues = "https://github.com/nopperabbo/gsuite-manager/issues"
Documentation = "https://github.com/nopperabbo/gsuite-manager/blob/main/docs/USAGE.md"
Changelog = "https://github.com/nopperabbo/gsuite-manager/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.100.0",
    "mypy>=1.10.0",
    "ruff>=0.5.0",
    "types-requests>=2.32.0",
    "types-PyYAML>=6.0",
    "pre-commit>=3.7.0",
]
docs = [
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.25.0",
]

[project.scripts]
gsm = "gsm.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gsm"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/gsm"]
exclude = ["tests/"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_unimported = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = [
    "googleapiclient.*",
    "google_auth_oauthlib.*",
    "google.auth.*",
    "google.oauth2.*",
    "dns.*",
    "questionary.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=src/gsm --cov-report=term-missing --cov-fail-under=70"
markers = [
    "integration: marks tests as integration (deselect with '-m \"not integration\"')",
]

[tool.coverage.run]
source = ["src/gsm"]
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
