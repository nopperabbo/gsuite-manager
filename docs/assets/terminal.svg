<svg xmlns="http://www.w3.org/2000/svg" width="700" height="470" viewBox="0 0 700 470">
  <style>
    .l1 { animation: fadeIn 0.3s ease 0.5s both }
    .l2 { animation: fadeIn 0.3s ease 0.8s both }
    .l3 { animation: fadeIn 0.3s ease 1.0s both }
    .l4 { animation: fadeIn 0.3s ease 1.2s both }
    .l5 { animation: fadeIn 0.3s ease 1.4s both }
    .l6 { animation: fadeIn 0.3s ease 1.6s both }
    .l7 { animation: fadeIn 0.3s ease 1.8s both }
    .l8 { animation: fadeIn 0.3s ease 2.0s both }
    .l9 { animation: fadeIn 0.3s ease 2.2s both }
    .l10 { animation: fadeIn 0.3s ease 2.4s both }
    .l11 { animation: fadeIn 0.3s ease 2.6s both }
    .l12 { animation: fadeIn 0.3s ease 2.8s both }
    .l13 { animation: fadeIn 0.3s ease 3.0s both }
    .l14 { animation: fadeIn 0.3s ease 3.2s both }
    .l15 { animation: fadeIn 0.3s ease 3.4s both }
    @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
    @keyframes blink { 50% { opacity: 0 } }
    .cursor { animation: blink 1s step-end infinite }
    text { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', monospace }
  </style>
  <!-- Window -->
  <rect width="700" height="470" rx="10" fill="#1E1E2E"/>
  <rect width="700" height="35" rx="10" fill="#313244"/>
  <rect y="25" width="700" height="10" fill="#313244"/>
  <circle cx="20" cy="17" r="6" fill="#F38BA8"/>
  <circle cx="40" cy="17" r="6" fill="#F9E2AF"/>
  <circle cx="60" cy="17" r="6" fill="#A6E3A1"/>
  <text x="350" y="22" font-size="12" fill="#CDD6F4" text-anchor="middle">gsm — zsh</text>
  <!-- Prompt -->
  <text x="20" y="60" font-size="13" fill="#A6E3A1">❯</text>
  <text x="35" y="60" font-size="13" fill="#CDD6F4">gsm</text>
  <!-- Menu -->
  <g class="l1"><text x="20" y="90" font-size="13" fill="#89B4FA">╭─────────────── gsm - Menu Utama ───────────────╮</text></g>
  <g class="l2"><text x="20" y="110" font-size="13" fill="#CDD6F4">│  </text><text x="42" y="110" font-size="13" fill="#F9E2AF">1.</text><text x="62" y="110" font-size="13" fill="#CDD6F4"> Onboard domains                          │</text></g>
  <g class="l3"><text x="20" y="130" font-size="13" fill="#CDD6F4">│  </text><text x="42" y="130" font-size="13" fill="#F9E2AF">2.</text><text x="62" y="130" font-size="13" fill="#CDD6F4"> Create users (dari file akun.txt)        │</text></g>
  <g class="l4"><text x="20" y="150" font-size="13" fill="#CDD6F4">│  </text><text x="42" y="150" font-size="13" fill="#F9E2AF">3.</text><text x="62" y="150" font-size="13" fill="#CDD6F4"> Create users (auto-generate)             │</text></g>
  <g class="l5"><text x="20" y="170" font-size="13" fill="#CDD6F4">│  </text><text x="42" y="170" font-size="13" fill="#F9E2AF">4.</text><text x="62" y="170" font-size="13" fill="#CDD6F4"> Reset password (bulk)                    │</text></g>
  <g class="l6"><text x="20" y="190" font-size="13" fill="#CDD6F4">│  </text><text x="42" y="190" font-size="13" fill="#F9E2AF">5.</text><text x="62" y="190" font-size="13" fill="#CDD6F4"> Suspend / Unsuspend users                │</text></g>
  <g class="l7"><text x="20" y="210" font-size="13" fill="#CDD6F4">│  </text><text x="42" y="210" font-size="13" fill="#F9E2AF">6.</text><text x="62" y="210" font-size="13" fill="#CDD6F4"> Delete users                             │</text></g>
  <g class="l8"><text x="20" y="230" font-size="13" fill="#CDD6F4">│  </text><text x="42" y="230" font-size="13" fill="#F9E2AF">7.</text><text x="62" y="230" font-size="13" fill="#CDD6F4"> Email aliases (add/list/remove)          │</text></g>
  <g class="l9"><text x="20" y="250" font-size="13" fill="#CDD6F4">│  </text><text x="42" y="250" font-size="13" fill="#F9E2AF">8.</text><text x="62" y="250" font-size="13" fill="#CDD6F4"> Groups / mailing list                    │</text></g>
  <g class="l10"><text x="20" y="270" font-size="13" fill="#CDD6F4">│  </text><text x="42" y="270" font-size="13" fill="#F9E2AF">9.</text><text x="62" y="270" font-size="13" fill="#CDD6F4"> Audit: CF vs Workspace gap               │</text></g>
  <g class="l11"><text x="20" y="290" font-size="13" fill="#CDD6F4">│ </text><text x="38" y="290" font-size="13" fill="#F9E2AF">10.</text><text x="62" y="290" font-size="13" fill="#CDD6F4"> Health check DNS                         │</text></g>
  <g class="l12"><text x="20" y="310" font-size="13" fill="#CDD6F4">│ </text><text x="38" y="310" font-size="13" fill="#F9E2AF">11.</text><text x="62" y="310" font-size="13" fill="#CDD6F4"> Check domain expiry                      │</text></g>
  <g class="l13"><text x="20" y="330" font-size="13" fill="#89DCEB">│    ... and 8 more commands                     │</text></g>
  <g class="l14"><text x="20" y="350" font-size="13" fill="#CDD6F4">│  </text><text x="42" y="350" font-size="13" fill="#F9E2AF">0.</text><text x="62" y="350" font-size="13" fill="#CDD6F4"> Exit                                     │</text></g>
  <g class="l15"><text x="20" y="370" font-size="13" fill="#89B4FA">╰────────────────────────────────────────────────╯</text></g>
  <!-- Bottom -->
  <g class="l15">
    <text x="20" y="405" font-size="13" fill="#A6E3A1">❯</text>
    <text x="35" y="405" font-size="13" fill="#6C7086">Pick a number (0-19):</text>
    <rect x="210" y="393" width="8" height="16" fill="#F5E0DC" class="cursor"/>
  </g>
  <g class="l15">
    <text x="20" y="445" font-size="11" fill="#6C7086">19 commands • idempotent • retry with backoff • progress bars • dry-run mode</text>
  </g>
</svg>
