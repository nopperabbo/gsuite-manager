cli:
  - changed-files:
      - any-glob-to-any-file: "src/gsm/cli/**"

api-clients:
  - changed-files:
      - any-glob-to-any-file: "src/gsm/clients/**"

core:
  - changed-files:
      - any-glob-to-any-file: "src/gsm/core/**"

workflows:
  - changed-files:
      - any-glob-to-any-file: "src/gsm/workflows/**"

tests:
  - changed-files:
      - any-glob-to-any-file: "tests/**"

docs:
  - changed-files:
      - any-glob-to-any-file:
          - "docs/**"
          - "*.md"

ci/cd:
  - changed-files:
      - any-glob-to-any-file: ".github/**"
